# À coller dans CasaOS : "+" > Installer une application personnalisée > Importer
# Remplace TONPSEUDO par ton pseudo GitHub EN MINUSCULES
name: liberty-hub
services:
  liberty-hub:
    image: ghcr.io/TONPSEUDO/liberty-hub:latest
    container_name: liberty-hub
    restart: unless-stopped
    environment:
      PORT: "8787"
      DATA_DIR: /data
    ports:
      - target: 8787
        published: "8787"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/liberty-hub
        target: /data

x-casaos:
  architectures:
    - amd64
    - arm64
  main: liberty-hub
  author: Simon
  developer: Simon
  category: Games
  title:
    en_us: Liberty Hub
  tagline:
    en_us: Amis et invitations pour Liberty Launcher (GTA IV)
  description:
    en_us: Serveur d'amis, d'invitations et de skins pour Liberty Launcher.
  port_map: "8787"
  index: /api/health
  scheme: http
